[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrl-nicknames"
version = "3.0.0"
description = "Readable, deterministic names for QRL addresses. Same address, same name, in every project."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Quantascan" }]
keywords = ["qrl", "blockchain", "address", "nickname", "human-readable", "deterministic"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/12remember/qrl-nicknames"
Specification = "https://github.com/12remember/qrl-nicknames/blob/main/SPEC.md"
Issues = "https://github.com/12remember/qrl-nicknames/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qrl_nicknames = ["py.typed"]
